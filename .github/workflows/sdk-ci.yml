name: TypeScript SDK CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run build
      # Verification only, never auto-fix: the SDK is generated formatted, so a diff here means
      # either hand-edited custom code or a regenerate that was not committed. Auto-fixing would
      # make the pushed bytes differ from generator output.
      - run: npx --yes @biomejs/biome@2.4.16 format --check .
