name: TypeScript SDK Release

on:
  release:
    types: [published]
  workflow_dispatch:
  # Called by release-please.yml at the released commit; the trigger the default
  # GITHUB_TOKEN can actually reach (token-created releases never fire `release`).
  workflow_call:

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSIONING_POLICY: manual
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.14.0"
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: npm run build
      # OIDC trusted publishing needs npm >= 11.5; pinned to the major (not `latest`) so a new
      # npm major raising its Node engine floor cannot break publishes against the pinned Node.
      - run: npm install -g npm@11
      - name: Publish to npm
        run: node scripts/publish-npm.mjs
